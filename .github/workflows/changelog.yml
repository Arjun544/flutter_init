name: "Changelog + Version"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# On every push to main: bump cli/package.json (create-page badge) and
# prepend an OpenAI-written Keep-a-Changelog section, then open a PR.
# (main is protected — direct pushes are rejected.)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: changelog-main
  cancel-in-progress: false

jobs:
  changelog:
    name: Update changelog & version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip bot merges and pushes that only touched changelog/version files.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        !contains(github.event.head_commit.message, '[changelog]') &&
        !startsWith(github.event.head_commit.message, 'docs: release v')
      )
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if push is changelog-only
        id: guard
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          echo "Changed files:"
          echo "$FILES"
          NON_CHANGELOG=$(echo "$FILES" | grep -vE '^(CHANGELOG\.md|cli/package\.json)$' || true)
          if [[ -z "$NON_CHANGELOG" && -n "$FILES" ]]; then
            echo "Only changelog/version files changed — skipping to avoid a loop."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate changelog + bump version
        id: release
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/update-changelog.mjs

      - name: Open changelog PR
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md cli/package.json
          if git diff --staged --quiet; then
            echo "No changelog/version changes to commit."
            exit 0
          fi

          BRANCH="chore/changelog-v${VERSION}"
          git checkout -B "$BRANCH"
          git commit -m "docs: release v${VERSION} [changelog][skip ci]"
          git push -u origin "$BRANCH" --force

          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING" ]]; then
            echo "PR #$EXISTING already open for $BRANCH"
            PR_URL=$(gh pr view "$EXISTING" --json url --jq .url)
          else
            PR_URL=$(gh pr create --base main --head "$BRANCH" \
              --title "docs: release v${VERSION} [changelog]" \
              --body "## Summary
          - Bump product version to **v${VERSION}** (\`cli/package.json\` — shown on \`/create\`)
          - Prepend Keep-a-Changelog entry for this push to \`main\`

          Auto-generated by the Changelog + Version workflow.")
          fi

          echo "PR: $PR_URL"

          # Best-effort auto-merge (needs branch rules that allow the Actions bot).
          gh pr merge "$PR_URL" --squash --auto --delete-branch || \
            echo "Auto-merge not enabled or not permitted — merge the PR manually."
