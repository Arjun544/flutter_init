name: "Tests — Tier 2 (Critical Combos + Dart Validation)"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


# Runs on pull requests to main.
# Layer 1 + Layer 2 Dart validation for ~30 critical combinations.
# Target duration: < 15 minutes.

on:
  pull_request:
    branches: [main]

jobs:
  layer1:
    name: Layer 1 — Template Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Layer 1 tests
        run: bun run test:unit

  layer2:
    name: Layer 2 — Dart Validation (Critical Combos)
    needs: layer1
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Layer 2 Dart validation (critical combos)
        run: bun run test:e2e
